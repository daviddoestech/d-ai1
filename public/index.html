<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D-AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d0d0d;
            color: white;
            font-family:
                Inter,
                Arial,
                sans-serif;

            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 64px;

            display: flex;
            align-items: center;

            padding: 0 22px;

            border-bottom:
                1px solid #242424;

            background: #111;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
        }

        .logo span {
            color: #55ff88;
        }

        #chat {
            flex: 1;

            overflow-y: auto;

            padding:
                30px
                max(20px, calc((100vw - 900px) / 2));
        }

        .message {
            max-width: 850px;

            margin:
                0 auto
                22px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .user {
            background: #1d1d1d;

            padding: 14px 17px;

            border-radius: 14px;

            margin-bottom: 15px;
        }

        .assistant {
            padding:
                5px 17px;

            color: #eeeeee;
        }

        .label {
            font-size: 12px;

            color: #777;

            margin-bottom: 5px;
        }

        .composer {
            padding:
                15px
                max(20px, calc((100vw - 900px) / 2));

            border-top:
                1px solid #242424;

            background: #111;
        }

        form {
            max-width: 850px;

            margin: auto;

            display: flex;

            gap: 10px;
        }

        textarea {
            flex: 1;

            resize: none;

            min-height: 52px;
            max-height: 180px;

            padding: 15px;

            border:
                1px solid #333;

            border-radius: 13px;

            background: #1a1a1a;

            color: white;

            outline: none;

            font-family: inherit;

            font-size: 15px;
        }

        textarea:focus {
            border-color: #55ff88;
        }

        button {
            width: 80px;

            border: none;

            border-radius: 13px;

            background: #55ff88;

            color: #07110b;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.9);
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .typing {
            display: inline-block;

            width: 7px;
            height: 18px;

            background: #55ff88;

            vertical-align: middle;

            animation:
                blink 0.8s infinite;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }

        }

        .empty {
            height: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #666;

            font-size: 18px;
        }

    </style>
</head>

<body>

    <header>
        <div class="logo">
            <span>D</span>-AI
        </div>
    </header>


    <main id="chat">

        <div
            id="empty"
            class="empty"
        >
            What can I help you with?
        </div>

    </main>


    <div class="composer">

        <form id="chatForm">

            <textarea
                id="message"
                placeholder="Message D-AI..."
                autocomplete="off"
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                type="submit"
            >
                Send
            </button>

        </form>

    </div>


    <script>

        // ====================================================
        // SESSION
        // ====================================================

        let sessionId =
            localStorage.getItem(
                "dai_session"
            );

        if (!sessionId) {

            sessionId =
                crypto.randomUUID();

            localStorage.setItem(
                "dai_session",
                sessionId
            );
        }


        // ====================================================
        // ELEMENTS
        // ====================================================

        const chat =
            document.getElementById(
                "chat"
            );

        const form =
            document.getElementById(
                "chatForm"
            );

        const input =
            document.getElementById(
                "message"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const empty =
            document.getElementById(
                "empty"
            );


        // ====================================================
        // ADD MESSAGE
        // ====================================================

        function addMessage(
            text,
            type
        ) {

            if (empty) {
                empty.remove();
            }

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                `message ${type}`;

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "label";

            label.textContent =
                type === "user"
                    ? "You"
                    : "D-AI";

            const content =
                document.createElement(
                    "div"
                );

            content.textContent =
                text;

            wrapper.appendChild(
                label
            );

            wrapper.appendChild(
                content
            );

            chat.appendChild(
                wrapper
            );

            chat.scrollTop =
                chat.scrollHeight;

            return content;
        }


        // ====================================================
        // STREAM CHAT
        // ====================================================

        async function sendMessage(
            message
        ) {

            const userContent =
                addMessage(
                    message,
                    "user"
                );

            const assistantContent =
                addMessage(
                    "",
                    "assistant"
                );

            sendButton.disabled =
                true;

            input.disabled =
                true;


            try {

                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message,
                                sessionId
                            })
                        }
                    );


                if (!response.ok) {

                    let errorText =
                        "Something went wrong.";

                    try {

                        const data =
                            await response.json();

                        errorText =
                            data.reply ||
                            errorText;

                    } catch {}

                    assistantContent.textContent =
                        errorText;

                    return;
                }


                // =================================================
                // READ STREAM
                // =================================================

                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder();

                let buffer = "";

                let finished =
                    false;


                while (!finished) {

                    const {
                        value,
                        done
                    } =
                        await reader.read();


                    if (done) {
                        break;
                    }


                    buffer +=
                        decoder.decode(
                            value,
                            {
                                stream: true
                            }
                        );


                    const events =
                        buffer.split(
                            "\n\n"
                        );


                    buffer =
                        events.pop();


                    for (
                        const event
                        of events
                    ) {

                        const lines =
                            event.split(
                                "\n"
                            );


                        for (
                            const line
                            of lines
                        ) {

                            if (
                                !line.startsWith(
                                    "data:"
                                )
                            ) {
                                continue;
                            }


                            const json =
                                line
                                    .slice(5)
                                    .trim();


                            if (!json) {
                                continue;
                            }


                            try {

                                const data =
                                    JSON.parse(
                                        json
                                    );


                                // -----------------------------
                                // TEXT CHUNK
                                // -----------------------------

                                if (
                                    typeof data.content ===
                                    "string"
                                ) {

                                    assistantContent.textContent +=
                                        data.content;

                                    chat.scrollTop =
                                        chat.scrollHeight;
                                }


                                // -----------------------------
                                // FINISHED
                                // -----------------------------

                                if (
                                    data.done
                                ) {

                                    finished =
                                        true;

                                    break;
                                }


                                // -----------------------------
                                // ERROR
                                // -----------------------------

                                if (
                                    data.error
                                ) {

                                    assistantContent.textContent +=
                                        "\n\n" +
                                        data.error;

                                    finished =
                                        true;

                                    break;
                                }

                            } catch {
                                // Ignore malformed/incomplete event
                            }

                        }

                    }

                }

            } catch (error) {

                console.error(
                    error
                );

                assistantContent.textContent =
                    "Couldn't connect to D-AI.";

            } finally {

                sendButton.disabled =
                    false;

                input.disabled =
                    false;

                input.focus();

            }

        }


        // ====================================================
        // FORM
        // ====================================================

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const message =
                    input.value.trim();

                if (!message) {
                    return;
                }

                input.value = "";

                await sendMessage(
                    message
                );

            }
        );


        // ====================================================
        // ENTER TO SEND
        // SHIFT+ENTER = NEW LINE
        // ====================================================

        input.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    form.requestSubmit();
                }

            }
        );


        // ====================================================
        // AUTO RESIZE
        // ====================================================

        input.addEventListener(
            "input",
            () => {

                input.style.height =
                    "auto";

                input.style.height =
                    Math.min(
                        input.scrollHeight,
                        180
                    ) + "px";

            }
        );

    </script>

</body>

</html>
