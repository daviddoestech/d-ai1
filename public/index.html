<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#212121">

<title>D-AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* =========================================================
   BASE
========================================================= */

:root {
    --bg: #212121;
    --sidebar: #171717;
    --sidebar-hover: #2a2a2a;

    --panel: #2f2f2f;
    --panel-hover: #383838;

    --border: rgba(255,255,255,.10);
    --border-soft: rgba(255,255,255,.07);

    --text: #ececec;
    --muted: #a7a7a7;
    --muted-2: #777;

    --accent: #4d8dff;
    --accent-hover: #6da2ff;

    --danger: #ef4444;

    --font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "Fira Code", monospace;

    --sidebar-width: 260px;
    --max-chat-width: 860px;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100dvh;
    display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: var(--sidebar-width);
    height: 100%;
    background: var(--sidebar);

    display: flex;
    flex-direction: column;

    flex-shrink: 0;

    border-right: 1px solid rgba(255,255,255,.05);

    z-index: 100;

    transition: transform .25s ease;
}

.sidebar-top {
    padding: 12px;
}

.brand {
    height: 44px;

    display: flex;
    align-items: center;

    padding: 0 10px;

    gap: 10px;

    margin-bottom: 8px;
}

.brand-logo {
    width: 28px;
    height: 28px;

    border-radius: 8px;

    background: #2f6fe4;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    color: white;
}

.brand-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.2px;
}

.new-chat {
    width: 100%;

    height: 42px;

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 8px;

    background: transparent;

    color: var(--text);

    font-family: var(--font);
    font-size: 14px;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 0 12px;

    cursor: pointer;

    transition:
        background .15s ease,
        border-color .15s ease;
}

.new-chat:hover {
    background: var(--sidebar-hover);
    border-color: rgba(255,255,255,.13);
}

.new-chat-icon {
    font-size: 18px;
    line-height: 1;
    color: #ddd;
}

.sidebar-label {
    padding: 18px 12px 8px;

    color: #777;

    font-size: 11px;
    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: .7px;
}

.suggestions {
    padding: 0 8px;

    display: flex;
    flex-direction: column;

    gap: 2px;
}

.suggestion {
    width: 100%;

    border: none;
    background: transparent;

    color: #c7c7c7;

    border-radius: 7px;

    padding: 9px 10px;

    font-family: var(--font);
    font-size: 13px;

    display: flex;
    align-items: center;

    gap: 9px;

    text-align: left;

    cursor: pointer;

    transition: background .12s ease;
}

.suggestion:hover {
    background: var(--sidebar-hover);
    color: #fff;
}

.suggestion-icon {
    width: 20px;

    text-align: center;

    opacity: .8;
}

.sidebar-bottom {
    margin-top: auto;

    padding: 10px 8px;

    border-top: 1px solid rgba(255,255,255,.06);
}

.sidebar-link {
    display: flex;
    align-items: center;

    gap: 10px;

    width: 100%;

    padding: 9px 10px;

    border-radius: 7px;

    color: #aaa;

    text-decoration: none;

    font-size: 13px;

    transition: background .12s ease, color .12s ease;
}

.sidebar-link:hover {
    background: var(--sidebar-hover);
    color: #eee;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;
    flex-direction: column;

    position: relative;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    height: 56px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border-bottom: 1px solid rgba(255,255,255,.06);

    background: rgba(33,33,33,.94);

    position: relative;

    z-index: 10;
}

.menu-button {
    width: 34px;
    height: 34px;

    border: none;
    background: transparent;

    border-radius: 7px;

    color: #cfcfcf;

    font-size: 19px;

    cursor: pointer;

    display: none;

    align-items: center;
    justify-content: center;
}

.menu-button:hover {
    background: #303030;
}

.header-title {
    font-size: 15px;
    font-weight: 600;

    color: #ededed;
}

.header-status {
    margin-left: 10px;

    color: #777;

    font-size: 12px;
}

/* =========================================================
   CHAT AREA
========================================================= */

.chat-container {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    scrollbar-width: thin;
    scrollbar-color: #555 transparent;
}

.chat-container::-webkit-scrollbar {
    width: 6px;
}

.chat-container::-webkit-scrollbar-track {
    background: transparent;
}

.chat-container::-webkit-scrollbar-thumb {
    background: #555;
    border-radius: 10px;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    min-height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 50px 20px 140px;

    text-align: center;
}

.welcome-logo {
    width: 48px;
    height: 48px;

    border-radius: 13px;

    background: #2f6fe4;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: 21px;

    margin-bottom: 22px;
}

.welcome h1 {
    margin: 0 0 8px;

    font-size: 30px;
    line-height: 1.2;

    font-weight: 600;

    letter-spacing: -.7px;
}

.welcome p {
    margin: 0;

    color: #9b9b9b;

    font-size: 14px;

    line-height: 1.6;
}

.welcome-suggestions {
    width: min(720px, 100%);

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;

    margin-top: 34px;
}

.welcome-card {
    background: transparent;

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 10px;

    padding: 14px;

    color: #d0d0d0;

    text-align: left;

    cursor: pointer;

    font-family: var(--font);

    transition:
        background .15s ease,
        border-color .15s ease;
}

.welcome-card:hover {
    background: #2b2b2b;
    border-color: rgba(255,255,255,.15);
}

.welcome-card-icon {
    display: block;

    font-size: 15px;

    margin-bottom: 7px;
}

.welcome-card-title {
    font-size: 13px;
    font-weight: 500;
}

.welcome-card-sub {
    margin-top: 3px;

    color: #777;

    font-size: 11px;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages {
    width: min(var(--max-chat-width), 100%);

    margin: 0 auto;

    padding: 28px 20px 160px;
}

.message {
    display: flex;

    gap: 13px;

    margin-bottom: 26px;
}

.avatar {
    width: 30px;
    height: 30px;

    flex-shrink: 0;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 13px;
}

.avatar.ai {
    background: #2f6fe4;
    color: white;
}

.avatar.user {
    background: #444;
    color: #ddd;
}

.message-content {
    min-width: 0;

    flex: 1;

    padding-top: 3px;

    font-size: 14px;

    line-height: 1.7;

    color: #e4e4e4;
}

.message-name {
    font-size: 12px;

    font-weight: 600;

    color: #aaa;

    margin-bottom: 4px;
}

.user-message .message-content {
    color: #eee;
}

/* =========================================================
   MARKDOWN
========================================================= */

.message-content p {
    margin: 0 0 10px;
}

.message-content p:last-child {
    margin-bottom: 0;
}

.message-content strong {
    color: #fff;
    font-weight: 600;
}

.message-content em {
    color: #c8c8c8;
}

.message-content a {
    color: #75a7ff;
}

.message-content ul,
.message-content ol {
    margin: 8px 0;
    padding-left: 22px;
}

.message-content li {
    margin: 4px 0;
}

.message-content h1,
.message-content h2,
.message-content h3 {
    color: #fff;

    margin: 18px 0 8px;

    line-height: 1.3;
}

.message-content h1 {
    font-size: 21px;
}

.message-content h2 {
    font-size: 18px;
}

.message-content h3 {
    font-size: 16px;
}

.message-content blockquote {
    border-left: 3px solid #555;

    margin: 12px 0;

    padding-left: 14px;

    color: #aaa;
}

.message-content code {
    font-family: var(--mono);

    font-size: 12px;

    background: #171717;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 5px;

    padding: 2px 5px;
}

.message-content pre {
    background: #171717;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 9px;

    overflow-x: auto;

    padding: 14px;

    margin: 12px 0;
}

.message-content pre code {
    background: transparent;

    border: none;

    padding: 0;

    color: #ddd;

    font-size: 12px;

    line-height: 1.6;
}

/* =========================================================
   THINKING
========================================================= */

.thinking {
    display: flex;

    align-items: flex-start;

    gap: 13px;

    margin-bottom: 26px;
}

.thinking .avatar {
    background: #2f6fe4;
    color: white;
}

.thinking-content {
    padding-top: 5px;

    color: #888;

    font-size: 13px;

    display: flex;
    align-items: center;

    gap: 5px;
}

.dot {
    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #999;

    animation: blink 1.3s infinite;
}

.dot:nth-child(2) {
    animation-delay: .15s;
}

.dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes blink {
    0%, 60%, 100% {
        opacity: .25;
    }

    30% {
        opacity: 1;
    }
}

/* =========================================================
   COMPOSER
========================================================= */

.composer-area {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 18px 20px 22px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(33,33,33,.95) 35%,
            #212121 65%
        );

    pointer-events: none;
}

.composer {
    width: min(820px, 100%);

    margin: 0 auto;

    pointer-events: auto;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    padding: 9px;

    background: #2f2f2f;

    border: 1px solid rgba(255,255,255,.10);

    border-radius: 14px;

    box-shadow: 0 4px 20px rgba(0,0,0,.18);

    transition:
        border-color .15s ease,
        box-shadow .15s ease;
}

.composer:focus-within {
    border-color: rgba(255,255,255,.18);

    box-shadow:
        0 4px 24px rgba(0,0,0,.22);
}

#msg {
    flex: 1;

    min-width: 0;

    min-height: 38px;
    max-height: 180px;

    resize: none;

    border: none;
    outline: none;

    background: transparent;

    color: #eee;

    font-family: var(--font);

    font-size: 14px;

    line-height: 1.5;

    padding: 9px 7px;

    overflow-y: auto;
}

#msg::placeholder {
    color: #858585;
}

.composer-button {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: none;

    border-radius: 9px;

    background: transparent;

    color: #aaa;

    font-size: 16px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .12s ease,
        color .12s ease;
}

.composer-button:hover {
    background: #404040;
    color: #eee;
}

.send-button {
    background: #fff;

    color: #222;

    font-size: 15px;

    font-weight: 700;
}

.send-button:hover {
    background: #e5e5e5;

    color: #111;
}

.send-button:disabled {
    background: #555;

    color: #888;

    cursor: not-allowed;
}

.composer-hint {
    width: min(820px, 100%);

    margin: 8px auto 0;

    text-align: center;

    font-size: 10px;

    color: #666;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.55);

    z-index: 90;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 760px) {

    .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        transform: translateX(-100%);

        box-shadow: 10px 0 35px rgba(0,0,0,.4);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebar.open + .overlay {
        display: block;
    }

    .menu-button {
        display: flex;
    }

    .header {
        padding: 0 12px;

        gap: 9px;
    }

    .header-title {
        font-size: 14px;
    }

    .header-status {
        display: none;
    }

    .welcome {
        padding:
            35px 16px
            150px;
    }

    .welcome h1 {
        font-size: 26px;
    }

    .welcome-suggestions {
        grid-template-columns: 1fr;
    }

    .messages {
        padding:
            24px 14px
            160px;
    }

    .message {
        gap: 10px;
        margin-bottom: 24px;
    }

    .avatar {
        width: 28px;
        height: 28px;

        border-radius: 7px;

        font-size: 12px;
    }

    .message-content {
        font-size: 14px;
    }

    .composer-area {
        padding:
            12px
            12px
            17px;
    }

    .composer {
        border-radius: 13px;
    }

    .composer-hint {
        font-size: 9px;
    }
}

@media(max-width: 420px) {

    .welcome-logo {
        width: 44px;
        height: 44px;
    }

    .welcome h1 {
        font-size: 24px;
    }

    .welcome p {
        font-size: 13px;
    }

    .welcome-card {
        padding: 12px;
    }

    .message-name {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <div class="brand-logo">✦</div>
                <div class="brand-name">D-AI</div>
            </div>

            <button
                class="new-chat"
                onclick="newChat()"
            >
                <span class="new-chat-icon">＋</span>
                <span>New chat</span>
            </button>

        </div>


        <div class="sidebar-label">
            Try asking
        </div>


        <div class="suggestions" id="sidebarSuggestions"></div>


        <div class="sidebar-bottom">

            <a
                class="sidebar-link"
                href="https://d-ai.rf.gd/faq.html"
                target="_blank"
                rel="noopener"
            >
                <span>?</span>
                <span>FAQ & Help</span>
            </a>

            <a
                class="sidebar-link"
                href="https://discord.gg/JEYN5UV66x"
                target="_blank"
                rel="noopener"
            >
                <span>◌</span>
                <span>Discord</span>
            </a>

        </div>

    </aside>


    <div
        class="overlay"
        id="overlay"
        onclick="closeSidebar()"
    ></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <header class="header">

            <button
                class="menu-button"
                onclick="toggleSidebar()"
                aria-label="Open menu"
            >
                ☰
            </button>

            <span class="header-title">
                D-AI
            </span>

            <span class="header-status">
                AI assistant
            </span>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <div
            class="chat-container"
            id="chatContainer"
        >

            <!-- WELCOME -->

            <section
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">
                    ✦
                </div>

                <h1>
                    How can I help?
                </h1>

                <p>
                    Ask D-AI a question, give it a task,<br>
                    or just start a conversation.
                </p>


                <div
                    class="welcome-suggestions"
                    id="welcomeSuggestions"
                ></div>

            </section>


            <!-- MESSAGES -->

            <div
                class="messages"
                id="messages"
                style="display:none;"
            ></div>

        </div>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer-area">

            <div class="composer">

                <textarea
                    id="msg"
                    rows="1"
                    placeholder="Message D-AI..."
                    autocomplete="off"
                    spellcheck="true"
                ></textarea>


                <button
                    class="composer-button"
                    id="voiceButton"
                    onclick="listen()"
                    title="Voice input"
                    aria-label="Voice input"
                >
                    🎤
                </button>


                <button
                    class="composer-button send-button"
                    id="sendBtn"
                    onclick="send()"
                    title="Send message"
                    aria-label="Send message"
                >
                    ↑
                </button>

            </div>


            <div class="composer-hint">
                D-AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   SESSION
========================================================= */

const sessionId =
    localStorage.getItem("d-ai-sid") ||
    crypto.randomUUID();

localStorage.setItem(
    "d-ai-sid",
    sessionId
);


/* =========================================================
   ELEMENTS
========================================================= */

const input =
    document.getElementById("msg");

const sendBtn =
    document.getElementById("sendBtn");

const voiceButton =
    document.getElementById("voiceButton");

const welcome =
    document.getElementById("welcome");

const messages =
    document.getElementById("messages");

const chatContainer =
    document.getElementById("chatContainer");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");


let chatStarted = false;
let isSending = false;


/* =========================================================
   SUGGESTIONS
========================================================= */

const SUGGESTIONS = [

    {
        icon: "⌘",
        title: "Help me write some code",
        subtitle: "Build, debug or explain code"
    },

    {
        icon: "?",
        title: "Explain something simply",
        subtitle: "Break down a difficult topic"
    },

    {
        icon: "✎",
        title: "Help me write",
        subtitle: "Essays, messages and ideas"
    },

    {
        icon: "◇",
        title: "Give me some ideas",
        subtitle: "Projects, startups and creativity"
    },

    {
        icon: "∑",
        title: "Help with a problem",
        subtitle: "Work through it step by step"
    },

    {
        icon: "◎",
        title: "Teach me something",
        subtitle: "Learn a new skill or concept"
    }

];


function randomSuggestions() {

    return [...SUGGESTIONS]
        .sort(() => Math.random() - .5)
        .slice(0, 4);

}


/* =========================================================
   BUILD SIDEBAR
========================================================= */

function buildSidebar() {

    const container =
        document.getElementById(
            "sidebarSuggestions"
        );

    container.innerHTML = "";

    randomSuggestions()
        .forEach(item => {

            const button =
                document.createElement("button");

            button.className =
                "suggestion";

            button.innerHTML = `
                <span class="suggestion-icon">
                    ${item.icon}
                </span>

                <span>
                    ${item.title}
                </span>
            `;

            button.onclick = () => {

                input.value =
                    item.title;

                autoResize();

                input.focus();

                closeSidebar();

            };

            container.appendChild(button);

        });

}


/* =========================================================
   BUILD WELCOME
========================================================= */

function buildWelcome() {

    const container =
        document.getElementById(
            "welcomeSuggestions"
        );

    container.innerHTML = "";

    randomSuggestions()
        .forEach(item => {

            const button =
                document.createElement("button");

            button.className =
                "welcome-card";

            button.innerHTML = `

                <span class="welcome-card-icon">
                    ${item.icon}
                </span>

                <span class="welcome-card-title">
                    ${item.title}
                </span>

                <div class="welcome-card-sub">
                    ${item.subtitle}
                </div>

            `;

            button.onclick = () => {

                input.value =
                    item.title;

                autoResize();

                input.focus();

            };

            container.appendChild(button);

        });

}


buildSidebar();
buildWelcome();


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

    sidebar.classList.toggle("open");

    if (
        sidebar.classList.contains("open")
    ) {

        overlay.style.display = "block";

    } else {

        overlay.style.display = "none";

    }

}


function closeSidebar() {

    sidebar.classList.remove("open");

    overlay.style.display = "none";

}


/* =========================================================
   START CHAT
========================================================= */

function showChat() {

    if (chatStarted) {
        return;
    }

    chatStarted = true;

    welcome.style.display = "none";

    messages.style.display = "block";

}


/* =========================================================
   ESCAPE USER TEXT
========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(text, role) {

    showChat();

    const isAI =
        role === "ai";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (isAI
            ? "ai-message"
            : "user-message");


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (isAI ? "ai" : "user");

    avatar.textContent =
        isAI ? "✦" : "U";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        isAI ? "D-AI" : "You";


    const body =
        document.createElement("div");

    if (isAI) {

        body.innerHTML =
            marked.parse(
                text,
                {
                    breaks: true
                }
            );

    } else {

        body.innerHTML =
            escapeHTML(text)
                .replace(/\n/g, "<br>");

    }


    content.appendChild(name);

    content.appendChild(body);

    wrapper.appendChild(avatar);

    wrapper.appendChild(content);

    messages.appendChild(wrapper);

    scrollToBottom();

}


/* =========================================================
   THINKING
========================================================= */

function showThinking() {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "thinking";

    wrapper.id =
        "thinking";


    wrapper.innerHTML = `

        <div class="avatar ai">
            ✦
        </div>

        <div class="thinking-content">

            <span>Thinking</span>

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

    `;


    messages.appendChild(wrapper);

    scrollToBottom();

}


function removeThinking() {

    const thinking =
        document.getElementById(
            "thinking"
        );

    if (thinking) {
        thinking.remove();
    }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    requestAnimationFrame(() => {

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    });

}


/* =========================================================
   SEND
========================================================= */

async function send() {

    if (isSending) {
        return;
    }

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    isSending = true;

    input.value = "";

    autoResize();

    input.disabled = true;

    sendBtn.disabled = true;

    showChat();

    addMessage(
        text,
        "user"
    );

    showThinking();


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text,
                        sessionId: sessionId
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        removeThinking();


        const reply =
            data.reply ||
            "I couldn't generate a response. Please try again.";


        addMessage(
            reply,
            "ai"
        );


        speak(reply);


    } catch (error) {

        console.error(
            "Chat error:",
            error
        );


        removeThinking();


        addMessage(
            "Something went wrong while contacting D-AI. Please try again.",
            "ai"
        );

    } finally {

        isSending = false;

        input.disabled = false;

        sendBtn.disabled = false;

        input.focus();

    }

}


/* =========================================================
   NEW CHAT
========================================================= */

async function newChat() {

    messages.innerHTML = "";

    messages.style.display = "none";

    welcome.style.display = "flex";

    chatStarted = false;

    buildSidebar();

    buildWelcome();

    closeSidebar();


    /*
       Reset is optional.

       If your backend has /reset,
       this will clear the server-side session.

       If it doesn't, nothing breaks.
    */

    try {

        await fetch(
            "/reset",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    sessionId
                })
            }
        );

    } catch {

        // Reset endpoint is optional.

    }

}


/* =========================================================
   ENTER TO SEND
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            send();

        }

    }
);


/* =========================================================
   AUTO RESIZE TEXTAREA
========================================================= */

function autoResize() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";

}


input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   VOICE INPUT
========================================================= */

let recognition = null;


function listen() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice input isn't supported by this browser."
        );

        return;

    }


    if (recognition) {

        try {
            recognition.stop();
        } catch {}

        recognition = null;

        voiceButton.textContent =
            "🎤";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart = () => {

        voiceButton.textContent =
            "⏹";

        voiceButton.style.color =
            "#ff7777";

    };


    recognition.onresult =
        event => {

            const text =
                event
                    .results[0][0]
                    .transcript;


            input.value =
                text;

            autoResize();

            input.focus();

        };


    recognition.onerror =
        error => {

            console.error(
                "Speech recognition:",
                error
            );

        };


    recognition.onend = () => {

        voiceButton.textContent =
            "🎤";

        voiceButton.style.color =
            "";

        recognition =
            null;

    };


    recognition.start();

}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    /*
       Strip markdown before speaking.
    */

    const clean =
        text
            .replace(/```[\s\S]*?```/g, "")
            .replace(/[*_#>`]/g, "")
            .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
            .trim();


    if (!clean) {
        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.rate =
        1.02;

    utterance.pitch =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   INITIAL FOCUS
========================================================= */

input.focus();

</script>
