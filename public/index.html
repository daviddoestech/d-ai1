<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#212121"
>

<title>D-AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {

    --bg: #212121;

    --sidebar: #171717;

    --sidebar-hover: #252525;

    --input: #2f2f2f;

    --input-hover: #363636;

    --border: rgba(255,255,255,.10);

    --border-light: rgba(255,255,255,.07);

    --text: #ececec;

    --muted: #a0a0a0;

    --muted-dark: #777;

    --accent: #4f8cff;

    --accent-hover: #6c9fff;

    --white: #ffffff;

    --font:
        "Inter",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    --mono:
        "Fira Code",
        monospace;

    --sidebar-width: 264px;

    --chat-width: 880px;

}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

}

body {

    background: var(--bg);

    color: var(--text);

    font-family: var(--font);

    overflow: hidden;

}

button,
textarea {

    font-family: inherit;

}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;
    height: 100dvh;

    display: flex;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    width: var(--sidebar-width);

    height: 100%;

    flex-shrink: 0;

    background: var(--sidebar);

    border-right:
        1px solid rgba(255,255,255,.05);

    display: flex;

    flex-direction: column;

    z-index: 100;

    transition:
        transform .25s ease;

}


.sidebar-header {

    padding: 14px 12px 8px;

}


.brand {

    height: 42px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 0 8px;

}


.brand-icon {

    width: 29px;
    height: 29px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background: #3b73d1;

    color: white;

    font-size: 14px;

}


.brand-text {

    font-size: 15px;

    font-weight: 600;

    letter-spacing: -.2px;

}


.new-chat {

    width: 100%;

    height: 42px;

    margin-top: 8px;

    padding: 0 11px;

    display: flex;

    align-items: center;

    gap: 9px;

    color: #e8e8e8;

    background: transparent;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 8px;

    cursor: pointer;

    font-size: 13px;

    transition:
        background .15s,
        border-color .15s;

}


.new-chat:hover {

    background: var(--sidebar-hover);

    border-color:
        rgba(255,255,255,.15);

}


.new-chat-plus {

    font-size: 18px;

    color: #bbb;

}


/* =========================================================
   SIDEBAR SUGGESTIONS
========================================================= */

.sidebar-title {

    padding:
        18px 18px 8px;

    color: #727272;

    font-size: 10px;

    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: .8px;

}


.sidebar-suggestions {

    padding: 0 8px;

}


.sidebar-item {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 9px 10px;

    border: none;

    border-radius: 7px;

    background: transparent;

    color: #c2c2c2;

    text-align: left;

    font-size: 12.5px;

    cursor: pointer;

}


.sidebar-item:hover {

    background: var(--sidebar-hover);

    color: white;

}


.sidebar-item-icon {

    width: 20px;

    color: #999;

    text-align: center;

}


/* =========================================================
   SIDEBAR FOOTER
========================================================= */

.sidebar-footer {

    margin-top: auto;

    padding: 9px 8px;

    border-top:
        1px solid rgba(255,255,255,.055);

}


.footer-link {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 9px 10px;

    color: #9b9b9b;

    text-decoration: none;

    border-radius: 7px;

    font-size: 12.5px;

}


.footer-link:hover {

    color: white;

    background:
        var(--sidebar-hover);

}


/* =========================================================
   MAIN
========================================================= */

.main {

    min-width: 0;

    flex: 1;

    height: 100%;

    display: flex;

    flex-direction: column;

    position: relative;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    height: 55px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 0 18px;

    border-bottom:
        1px solid rgba(255,255,255,.055);

    background:
        rgba(33,33,33,.96);

    z-index: 10;

}


.menu-button {

    width: 34px;
    height: 34px;

    display: none;

    align-items: center;
    justify-content: center;

    background: transparent;

    border: none;

    border-radius: 7px;

    color: #ccc;

    font-size: 18px;

    cursor: pointer;

}


.menu-button:hover {

    background: #303030;

}


.topbar-title {

    font-size: 14px;

    font-weight: 600;

}


.topbar-model {

    color: #737373;

    font-size: 11px;

}


/* =========================================================
   CHAT SCROLL
========================================================= */

.chat-scroll {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    scrollbar-width: thin;

    scrollbar-color:
        #555 transparent;

}


.chat-scroll::-webkit-scrollbar {

    width: 6px;

}


.chat-scroll::-webkit-scrollbar-track {

    background: transparent;

}


.chat-scroll::-webkit-scrollbar-thumb {

    background: #505050;

    border-radius: 20px;

}


/* =========================================================
   WELCOME
========================================================= */

.welcome {

    min-height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:
        40px 20px 150px;

    text-align: center;

}


.welcome-icon {

    width: 50px;
    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #376fc9;

    border-radius: 13px;

    font-size: 21px;

    color: white;

    margin-bottom: 20px;

}


.welcome-title {

    margin: 0;

    font-size: 28px;

    line-height: 1.2;

    letter-spacing: -.7px;

    font-weight: 600;

}


.welcome-description {

    margin:
        10px 0 0;

    color: #999;

    font-size: 13px;

    line-height: 1.6;

}


.welcome-grid {

    width:
        min(720px, 100%);

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 30px;

}


.welcome-card {

    min-height: 83px;

    padding: 13px 14px;

    text-align: left;

    background: transparent;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius: 9px;

    color: #ddd;

    cursor: pointer;

    transition:
        background .15s,
        border-color .15s,
        transform .15s;

}


.welcome-card:hover {

    background: #2a2a2a;

    border-color:
        rgba(255,255,255,.15);

    transform:
        translateY(-1px);

}


.card-icon {

    display: block;

    margin-bottom: 7px;

    color: #aaa;

    font-size: 14px;

}


.card-title {

    display: block;

    font-size: 12.5px;

    font-weight: 500;

}


.card-description {

    margin-top: 4px;

    color: #707070;

    font-size: 11px;

}


/* =========================================================
   MESSAGES
========================================================= */

.messages {

    width:
        min(var(--chat-width), 100%);

    margin: 0 auto;

    padding:
        30px 20px 165px;

}


.message {

    display: flex;

    gap: 13px;

    margin-bottom: 30px;

}


.avatar {

    width: 29px;
    height: 29px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    font-size: 12px;

    margin-top: 1px;

}


.avatar-ai {

    background: #376fc9;

    color: white;

}


.avatar-user {

    background: #414141;

    color: #ddd;

}


.message-body {

    min-width: 0;

    flex: 1;

}


.message-label {

    margin-bottom: 5px;

    color: #999;

    font-size: 11px;

    font-weight: 600;

}


.message-text {

    color: #e2e2e2;

    font-size: 14px;

    line-height: 1.7;

    word-break: break-word;

}


/* =========================================================
   MARKDOWN
========================================================= */

.message-text p {

    margin:
        0 0 10px;

}


.message-text p:last-child {

    margin-bottom: 0;

}


.message-text strong {

    color: #fff;

    font-weight: 600;

}


.message-text a {

    color: #72a3ff;

}


.message-text ul,
.message-text ol {

    margin:
        9px 0;

    padding-left: 23px;

}


.message-text li {

    margin: 4px 0;

}


.message-text h1,
.message-text h2,
.message-text h3 {

    color: white;

    line-height: 1.3;

    margin:
        18px 0 8px;

}


.message-text h1 {

    font-size: 21px;

}


.message-text h2 {

    font-size: 18px;

}


.message-text h3 {

    font-size: 16px;

}


.message-text blockquote {

    margin:
        12px 0;

    padding-left: 13px;

    border-left:
        3px solid #555;

    color: #aaa;

}


.message-text code {

    font-family: var(--mono);

    font-size: 12px;

    padding:
        2px 5px;

    border-radius: 5px;

    background: #171717;

    border:
        1px solid rgba(255,255,255,.08);

}


.message-text pre {

    margin:
        13px 0;

    padding: 14px;

    overflow-x: auto;

    border-radius: 9px;

    background: #171717;

    border:
        1px solid rgba(255,255,255,.08);

}


.message-text pre code {

    padding: 0;

    background: transparent;

    border: none;

    color: #ddd;

    line-height: 1.6;

}


/* =========================================================
   THINKING
========================================================= */

.thinking {

    display: flex;

    gap: 13px;

    margin-bottom: 28px;

}


.thinking-text {

    display: flex;

    align-items: center;

    gap: 4px;

    padding-top: 6px;

    color: #777;

    font-size: 12px;

}


.thinking-dot {

    width: 4px;
    height: 4px;

    background: #888;

    border-radius: 50%;

    animation:
        thinking 1.25s infinite;

}


.thinking-dot:nth-child(2) {

    animation-delay: .15s;

}


.thinking-dot:nth-child(3) {

    animation-delay: .3s;

}


@keyframes thinking {

    0%, 65%, 100% {

        opacity: .25;

        transform:
            translateY(0);

    }

    30% {

        opacity: 1;

        transform:
            translateY(-2px);

    }

}


/* =========================================================
   COMPOSER
========================================================= */

.composer-area {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        17px 20px 21px;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(33,33,33,.88) 30%,
            #212121 58%
        );

    pointer-events: none;

}


.composer {

    width:
        min(820px, 100%);

    margin: 0 auto;

    display: flex;

    align-items: flex-end;

    gap: 6px;

    padding: 8px;

    background: var(--input);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 14px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.18);

    pointer-events: auto;

    transition:
        border-color .15s,
        box-shadow .15s;

}


.composer:focus-within {

    border-color:
        rgba(255,255,255,.17);

    box-shadow:
        0 6px 30px rgba(0,0,0,.24);

}


#msg {

    flex: 1;

    min-width: 0;

    min-height: 39px;

    max-height: 180px;

    resize: none;

    padding:
        9px 7px;

    border: none;

    outline: none;

    background: transparent;

    color: #eee;

    font-family: var(--font);

    font-size: 14px;

    line-height: 1.5;

}


#msg::placeholder {

    color: #808080;

}


.action-button {

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border: none;

    border-radius: 9px;

    background: transparent;

    color: #aaa;

    font-size: 18px;

    cursor: pointer;

    transition:
        background .12s,
        color .12s;

}


.action-button:hover {

    background: #414141;

    color: white;

}


.send-button {

    background: white;

    color: #222;

    font-size: 17px;

    font-weight: 700;

}


.send-button:hover {

    background: #e8e8e8;

    color: #111;

}


.send-button:disabled {

    background: #555;

    color: #888;

    cursor: not-allowed;

}


.composer-hint {

    width:
        min(820px, 100%);

    margin:
        7px auto 0;

    text-align: center;

    color: #666;

    font-size: 10px;

    pointer-events: auto;

}


/* =========================================================
   MOBILE OVERLAY
========================================================= */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        rgba(0,0,0,.55);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 760px) {

    .sidebar {

        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        transform:
            translateX(-100%);

        box-shadow:
            12px 0 35px rgba(0,0,0,.4);

    }


    .sidebar.open {

        transform:
            translateX(0);

    }


    .menu-button {

        display: flex;

    }


    .topbar {

        padding:
            0 12px;

    }


    .topbar-model {

        display: none;

    }


    .welcome {

        padding:
            35px 15px 150px;

    }


    .welcome-title {

        font-size: 25px;

    }


    .welcome-grid {

        grid-template-columns:
            1fr;

    }


    .messages {

        padding:
            24px 13px 165px;

    }


    .message {

        gap: 10px;

        margin-bottom: 25px;

    }


    .avatar {

        width: 28px;
        height: 28px;

    }


    .message-text {

        font-size: 14px;

    }


    .composer-area {

        padding:
            12px 11px 17px;

    }


    .composer {

        border-radius: 13px;

    }

}


/* =========================================================
   VERY SMALL SCREENS
========================================================= */

@media(max-width: 380px) {

    .welcome-title {

        font-size: 23px;

    }


    .welcome-description {

        font-size: 12px;

    }


    .messages {

        padding-left: 10px;
        padding-right: 10px;

    }


    .message-text {

        font-size: 13.5px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <span class="brand-text">
                    D-AI
                </span>

            </div>


            <button
                class="new-chat"
                onclick="newChat()"
            >

                <span class="new-chat-plus">
                    ＋
                </span>

                <span>
                    New chat
                </span>

            </button>

        </div>


        <div class="sidebar-title">
            Suggestions
        </div>


        <div
            class="sidebar-suggestions"
            id="sidebarSuggestions"
        ></div>


        <div class="sidebar-footer">

            <a
                class="footer-link"
                href="https://d-ai.xo.je/faq"
                target="_blank"
                rel="noopener"
            >
                <span>?</span>
                <span>FAQ & Help</span>
            </a>


            <a
                class="footer-link"
                href="https://discord.gg/XCETB7bYCa"
                target="_blank"
                rel="noopener"
            >
                <span>◌</span>
                <span>Discord</span>
            </a>

        </div>

    </aside>


    <div
        class="overlay"
        id="overlay"
        onclick="closeSidebar()"
    ></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <header class="topbar">

            <button
                class="menu-button"
                onclick="toggleSidebar()"
                aria-label="Open sidebar"
            >
                ☰
            </button>


            <span class="topbar-title">
                D-AI
            </span>


            <span class="topbar-model">
                AI assistant
            </span>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <div
            class="chat-scroll"
            id="chatScroll"
        >


            <!-- WELCOME -->

            <section
                class="welcome"
                id="welcome"
            >

                <div class="welcome-icon">
                    ✦
                </div>


                <h1 class="welcome-title">
                    How can I help?
                </h1>


                <p class="welcome-description">
                    Ask a question, work through a problem,<br>
                    or just start a conversation.
                </p>


                <div
                    class="welcome-grid"
                    id="welcomeGrid"
                ></div>

            </section>


            <!-- MESSAGES -->

            <div
                class="messages"
                id="messages"
                style="display:none"
            ></div>


        </div>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer-area">


            <div class="composer">


                <textarea
                    id="msg"
                    rows="1"
                    placeholder="Message D-AI..."
                    autocomplete="off"
                    spellcheck="true"
                ></textarea>


                <button
                    class="action-button send-button"
                    id="sendBtn"
                    onclick="send()"
                    aria-label="Send message"
                    title="Send"
                >
                    ↑
                </button>


            </div>


            <div class="composer-hint">
                D-AI can make mistakes. Check important information.
            </div>


        </div>


    </main>


</div>


<script>

/* =========================================================
   SESSION
========================================================= */

const sessionId =
    localStorage.getItem("d-ai-sid") ||
    crypto.randomUUID();

localStorage.setItem(
    "d-ai-sid",
    sessionId
);


/* =========================================================
   ELEMENTS
========================================================= */

const input =
    document.getElementById("msg");

const sendBtn =
    document.getElementById("sendBtn");

const welcome =
    document.getElementById("welcome");

const messages =
    document.getElementById("messages");

const chatScroll =
    document.getElementById("chatScroll");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");


let chatStarted = false;

let sending = false;


/* =========================================================
   SUGGESTIONS
========================================================= */

const SUGGESTIONS = [

    {
        icon: "⌘",
        title: "Help me write some code",
        description: "Build or debug something"
    },

    {
        icon: "?",
        title: "Explain something simply",
        description: "Break down a difficult topic"
    },

    {
        icon: "✎",
        title: "Help me write",
        description: "Essays, messages and ideas"
    },

    {
        icon: "◇",
        title: "Give me some ideas",
        description: "Projects, startups and more"
    },

    {
        icon: "∑",
        title: "Help me solve a problem",
        description: "Work through it together"
    },

    {
        icon: "◎",
        title: "Teach me something",
        description: "Learn a new skill"
    }

];


function shuffledSuggestions() {

    return [...SUGGESTIONS]
        .sort(
            () => Math.random() - 0.5
        );

}


/* =========================================================
   SIDEBAR
========================================================= */

function buildSidebar() {

    const container =
        document.getElementById(
            "sidebarSuggestions"
        );

    container.innerHTML = "";


    shuffledSuggestions()
        .slice(0, 5)
        .forEach(item => {

            const button =
                document.createElement("button");

            button.className =
                "sidebar-item";


            button.innerHTML = `

                <span class="sidebar-item-icon">
                    ${item.icon}
                </span>

                <span>
                    ${item.title}
                </span>

            `;


            button.onclick = () => {

                input.value =
                    item.title;

                autoResize();

                input.focus();

                closeSidebar();

            };


            container.appendChild(button);

        });

}


/* =========================================================
   WELCOME
========================================================= */

function buildWelcome() {

    const container =
        document.getElementById(
            "welcomeGrid"
        );

    container.innerHTML = "";


    shuffledSuggestions()
        .slice(0, 4)
        .forEach(item => {

            const button =
                document.createElement("button");

            button.className =
                "welcome-card";


            button.innerHTML = `

                <span class="card-icon">
                    ${item.icon}
                </span>

                <span class="card-title">
                    ${item.title}
                </span>

                <div class="card-description">
                    ${item.description}
                </div>

            `;


            button.onclick = () => {

                input.value =
                    item.title;

                autoResize();

                input.focus();

            };


            container.appendChild(button);

        });

}


buildSidebar();

buildWelcome();


/* =========================================================
   SIDEBAR CONTROLS
========================================================= */

function toggleSidebar() {

    sidebar.classList.toggle("open");

    overlay.style.display =
        sidebar.classList.contains("open")
            ? "block"
            : "none";

}


function closeSidebar() {

    sidebar.classList.remove("open");

    overlay.style.display =
        "none";

}


/* =========================================================
   START CHAT
========================================================= */

function showChat() {

    if (chatStarted) {
        return;
    }

    chatStarted = true;

    welcome.style.display =
        "none";

    messages.style.display =
        "block";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(text, role) {

    showChat();


    const ai =
        role === "ai";


    const message =
        document.createElement("div");

    message.className =
        "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (ai
            ? "avatar-ai"
            : "avatar-user");


    avatar.textContent =
        ai ? "✦" : "U";


    const body =
        document.createElement("div");

    body.className =
        "message-body";


    const label =
        document.createElement("div");

    label.className =
        "message-label";

    label.textContent =
        ai ? "D-AI" : "You";


    const textElement =
        document.createElement("div");

    textElement.className =
        "message-text";


    if (ai) {

        textElement.innerHTML =
            marked.parse(
                text,
                {
                    breaks: true
                }
            );

    } else {

        textElement.innerHTML =
            escapeHTML(text)
                .replace(
                    /\n/g,
                    "<br>"
                );

    }


    body.appendChild(label);

    body.appendChild(textElement);

    message.appendChild(avatar);

    message.appendChild(body);

    messages.appendChild(message);


    scrollBottom();

}


/* =========================================================
   THINKING
========================================================= */

function showThinking() {

    const element =
        document.createElement("div");

    element.className =
        "thinking";

    element.id =
        "thinking";


    element.innerHTML = `

        <div class="avatar avatar-ai">
            ✦
        </div>

        <div class="thinking-text">

            <span>Thinking</span>

            <span
                class="thinking-dot"
            ></span>

            <span
                class="thinking-dot"
            ></span>

            <span
                class="thinking-dot"
            ></span>

        </div>

    `;


    messages.appendChild(element);

    scrollBottom();

}


function removeThinking() {

    const element =
        document.getElementById(
            "thinking"
        );

    if (element) {
        element.remove();
    }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom() {

    requestAnimationFrame(() => {

        chatScroll.scrollTop =
            chatScroll.scrollHeight;

    });

}


/* =========================================================
   SEND
========================================================= */

async function send() {

    if (sending) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    sending = true;


    input.value = "";

    autoResize();


    input.disabled = true;

    sendBtn.disabled = true;


    showChat();


    addMessage(
        text,
        "user"
    );


    showThinking();


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text,
                        sessionId
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.reply ||
                "Request failed"
            );

        }


        removeThinking();


        addMessage(
            data.reply ||
            "I didn't receive a response.",
            "ai"
        );


    } catch (error) {

        console.error(
            "D-AI error:",
            error
        );


        removeThinking();


        addMessage(
            error.message ||
            "Something went wrong. Please try again.",
            "ai"
        );


    } finally {

        sending = false;

        input.disabled = false;

        sendBtn.disabled = false;

        input.focus();

    }

}


/* =========================================================
   NEW CHAT
========================================================= */

async function newChat() {

    messages.innerHTML = "";

    messages.style.display =
        "none";

    welcome.style.display =
        "flex";

    chatStarted = false;


    buildSidebar();

    buildWelcome();

    closeSidebar();


    try {

        await fetch(
            "/reset",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    sessionId
                })
            }
        );

    } catch {

        // The UI still resets
        // if the server reset fails.

    }


    input.value = "";

    autoResize();

    input.focus();

}


/* =========================================================
   TEXTAREA
========================================================= */

function autoResize() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";

}


input.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            send();

        }

    }
);


/* =========================================================
   ESC CLOSES SIDEBAR
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            closeSidebar();

        }

    }
);


/* =========================================================
   START
========================================================= */

input.focus();

</script>
